# =============================================================================
# Lorekeeper — Production Docker Compose
#
# Usage:
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Before starting:
#   1. Copy .env.example → .env and fill in all values
#   2. Set ENVIRONMENT=production in .env
#   3. Set CORS_ORIGINS to your actual domain, e.g. ["https://yourdomain.com"]
#   4. Pick an LLM path:
#      a) GPU host running KoboldCpp on the HOST — point KOBOLD_URL at the
#         host gateway: KOBOLD_URL=http://host.docker.internal:5001
#         (needs `extra_hosts: - "host.docker.internal:host-gateway"` added
#         to the backend service below on Linux)
#      b) No GPU (e.g. Oracle Cloud's Always Free Ampere A1 tier) — use the
#         `ollama` service below instead, reachable internally at
#         http://ollama:11434. See scripts/deploy-oci.sh for the one-time
#         model import step. Point Settings' provider URL at it per-account,
#         or set it as the default in .env.
#
# HTTPS works out of the box: if no certificate is mounted, the nginx
#   container generates a self-signed one at startup (see
#   nginx/ensure-certs.sh) — browsers show a one-time warning, fine for
#   local/LAN use. For a real domain, get a Let's Encrypt cert with
#   `certbot certonly --standalone` (stop the nginx container first to free
#   port 80; see docs/OCI_DEPLOYMENT.md's TLS section and
#   scripts/certbot-{pre,post}-hook.sh for renewal) — the nginx service
#   below already mounts /etc/letsencrypt and prefers a real cert when one
#   exists there.
# =============================================================================

services:

  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Not exposed to host — only backend can reach it
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    # Resource ceilings on every service below (see the same note on
    # `backend`) — respected by plain `docker compose up` on this Compose
    # version, no swarm needed. postgres idles under 50MB; this is pure
    # headroom, not a reflection of expected steady-state usage.
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 3g

  # Valkey (BSD-3-Clause, Linux Foundation): a drop-in, Redis-compatible
  # server. Replaces redis:7-alpine, which resolves to Redis 7.4+ (RSALv2 /
  # SSPL, not shippable in the commercial edition). The app reaches it at
  # VALKEY_URL (redis:// scheme, redis-py client: that's the wire protocol).
  # Fresh `valkey_data` volume: a Redis 7.4 dump (RDB format 12) can't be read
  # by Valkey 8, and everything stored here is short-lived. See "Upgrading
  # from Redis to Valkey" in README.md.
  valkey:
    image: valkey/valkey:8.1.11-alpine
    restart: unless-stopped
    command: valkey-server --save 60 1 --loglevel warning
    volumes:
      - valkey_data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    # Transitional: the old `redis` hostname still resolves, so an existing
    # .env with REDIS_URL=redis://redis:6379/0 keeps working. Remove once
    # REDIS_URL is gone.
    networks:
      default:
        aliases: [redis]
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512m

  # Optional: CPU-served LLM for GPU-less hosts (e.g. OCI Always Free Ampere
  # A1). Not exposed to the host — only reachable from other containers on
  # this network at http://ollama:11434. Point a user's Settings provider URL
  # (or the app-wide default in .env) there to use it. First run needs a
  # one-time `docker compose -f docker-compose.prod.yml exec ollama ollama
  # create lorekeeper -f /import-models/lorekeeper-Modelfile` — see
  # scripts/deploy-oci.sh, which does this automatically.
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    environment:
      # Two models now live here (see scripts/deploy-oci.sh's import step) —
      # "lorekeeper" (fine-tuned) and "lorekeeper-base", for Settings' AI
      # Provider toggle and Model Evaluation's quick-compare buttons.
      # Without this, Ollama's default keeps only one loaded at a time, so
      # every switch between them pays a ~60s cold-load penalty on this
      # CPU-only ARM host (confirmed live — see llama_server.go's "waiting
      # for llama-server to become available" in this container's logs).
      # Two Q4 7B models (~4GB each) comfortably fit in the instance's 24GB
      # RAM alongside everything else, so keep both resident.
      OLLAMA_MAX_LOADED_MODELS: "2"
      OLLAMA_KEEP_ALIVE: "60m"
    volumes:
      - ollama_data:/root/.ollama
      - ./src/ml/models:/import-models:ro
    healthcheck:
      test: ["CMD-SHELL", "ollama list || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s
    # Measured live: two Q4 7B models loaded simultaneously (OLLAMA_MAX_LOADED_
    # MODELS=2 above) run ~9GB combined; 14GB leaves real headroom for context/
    # KV-cache growth during generation without letting a leak or a third
    # model somehow loading eat the whole box.
    #
    # CPU: no cap by default (cpus 0 = unlimited) — llama.cpp generation speed
    # scales with cores, and the old fixed cpus "3.0" held a 24-core host to
    # ~0.7 tok/s, long enough for chat answers to hit KOBOLD_TIMEOUT_SECONDS.
    # Set OLLAMA_CPUS in .env (e.g. OLLAMA_CPUS=6) to reserve cores for other
    # work on a shared host. Unset or empty falls back to 0 (the `:-`).
    deploy:
      resources:
        limits:
          cpus: "${OLLAMA_CPUS:-0}"
          memory: 14g

  backend:
    build:
      context: ./src/backend
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    env_file: .env
    environment:
      ENVIRONMENT: production
      # Shared JSON log file all gunicorn workers append to — what the admin
      # portal's System tab (log viewer / support bundle) reads. On a named
      # volume so logs survive container recreation; stdout (docker logs)
      # still gets everything too.
      LOG_FILE: /var/log/lorekeeper/backend.log
    # eval_service.py resolves the validation set at /ml/data/processed/... —
    # correct relative to a full repo checkout, but the backend image's build
    # context is only ./src/backend, so nothing under src/ml ever made it in.
    # Model Evaluation (and its quick-compare buttons) 404'd on this in
    # production with no earlier symptom, since local dev runs against a full
    # checkout where the path just happens to resolve. Mounted read-only —
    # small (~2MB) static training/eval data, never written to at runtime.
    volumes:
      - ./src/ml/data:/ml/data:ro
      - backend_logs:/var/log/lorekeeper
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
    # Run migrations on startup before serving. Deliberately a single line —
    # a folded (`>`) multi-line YAML scalar only folds line breaks to spaces
    # for lines at the *same* indentation as the first content line; any
    # more-indented continuation (as this used to have) is instead kept
    # literal, so `sh -c` received real embedded newlines and every flag
    # after `gunicorn app.main:app` ran as its own bogus one-word command
    # (`sh: -w: not found`, etc.). One line sidesteps the whole footgun.
    # --forwarded-allow-ips="*" is safe here specifically because the backend
    # isn't exposed to the host (see the comment below) — nginx is the only
    # thing that can ever reach it, so there's no untrusted peer that could
    # spoof X-Forwarded-For. Without this, gunicorn/UvicornWorker only trusts
    # forwarded headers from a peer at 127.0.0.1 (its own default), so on the
    # compose network every request's "real" IP was actually nginx's
    # container IP — identical for every user. That silently broke: (1) the
    # per-IP @limiter.limit(...) decorators in auth.py, which all bucketed
    # every client together under one shared quota instead of limiting each
    # attacker individually, and (2) any IP that ends up in logs.
    command: sh -c "python -m alembic upgrade head && gunicorn app.main:app -w 4 -k uvicorn.workers.UvicornWorker --bind 0.0.0.0:8000 --forwarded-allow-ips='*' --timeout 180 --graceful-timeout 30 --access-logfile - --error-logfile -"
    # Not exposed to host — nginx is the only entry point
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    # Measured live via `docker stats`: 4 gunicorn workers idle at ~6.4GB
    # RAM combined — each worker independently loads its own copy of the
    # spaCy transformer, sentence-transformers, and Whisper models at
    # startup (load_nlp_model/load_embedding_model run per-process, not
    # shared).
    #
    # This was originally capped at 10g on that idle number alone, which
    # was wrong: it only covers steady state, not the concurrent *loading*
    # burst all 4 workers do at once on every container start/redeploy.
    # Confirmed live via cgroup memory.peak with the cap raised out of the
    # way: real unconstrained startup peak is ~11.86GiB, ~1.86GB over the
    # old 10g ceiling. Every redeploy was hitting that ceiling and having
    # gunicorn workers cgroup-OOM-killed mid-boot ("Worker was sent
    # SIGKILL! Perhaps out of memory?" in the logs) — gunicorn's master
    # auto-respawned them so the container still reached `healthy`
    # eventually and this went unnoticed, but real requests landing on a
    # worker during that flapping window would fail. 14g leaves ~2GB of
    # real headroom above the measured peak, not the idle number.
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 14g
    # `default` for postgres/valkey/ollama/nginx, `models` to reach the ml
    # and stt sidecars.
    networks:
      - default
      - models

  # Background Jobs (E0-Jobs.3): an RQ WorkerPool of WORKER_PROCESSES
  # (default 2) LorekeeperWorker processes on the interactive, onsave and
  # backfill queues (highest priority first). Same image and env as the
  # backend; it starts after the backend is healthy, so after its migrations.
  # No ports and no nginx route. Override the ceiling with WORKER_MEM_LIMIT.
  worker:
    build:
      context: ./src/backend
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    env_file: .env
    environment:
      ENVIRONMENT: production
    depends_on:
      backend:
        condition: service_healthy
    command: python -m app.jobs.worker
    # `docker stop` sends SIGTERM: RQ stops taking Jobs and lets the running
    # ones finish for up to this long, then SIGKILL. A Job killed here stays
    # `running` until the reaper (E0-Jobs.4) requeues it, ~60-90 s later.
    stop_grace_period: 60s
    networks:
      - default
      - models
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: ${WORKER_MEM_LIMIT:-1g}

  # Shared embeddings + NER sidecar (src/services/ml): one copy of MiniLM and
  # en_core_web_trf instead of one per gunicorn worker. Not exposed to the
  # host and no nginx route — only on the internal `models` network, where
  # the backend reaches it at ML_URL (default http://ml:8000). Nothing calls
  # it yet (E0-Platform.6 switches the callers over). Weights are baked into
  # the image; it runs offline.
  ml:
    # Tagged so scripts/sidecar_smoke.sh ml finds it by its default name.
    image: lorekeeper-ml:latest
    build:
      context: ./src/services/ml
      dockerfile: Dockerfile
    restart: unless-stopped
    # Declared-MB budget for the lazy NLI/OCR models (E0-Platform.4); empty
    # keeps the sidecar default (2000).
    environment:
      ML_RESIDENT_BUDGET_MB: ${ML_RESIDENT_BUDGET_MB:-}
    networks:
      - models
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=4)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 180s
    # Provisional ceiling: MiniLM + en_core_web_trf resident in one process,
    # plus the lazy NLI/OCR models under ML_RESIDENT_BUDGET_MB; measured
    # limits come with E0-Platform.7. Override with ML_MEM_LIMIT in .env.
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: ${ML_MEM_LIMIT:-2560m}

  # faster-whisper speech-to-text sidecar (src/services/stt): one copy of the
  # model instead of openai-whisper in every gunicorn worker. Same rules as
  # ml: no host port, no nginx route, only the internal `models` network,
  # where the backend reaches it at STT_URL (default http://stt:8000).
  # Weights are baked into the image; it runs offline. The model loads on
  # the first request and unloads after STT_IDLE_UNLOAD_S idle.
  stt:
    image: lorekeeper-stt:latest
    build:
      context: ./src/services/stt
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      STT_COMPUTE_TYPE: ${STT_COMPUTE_TYPE:-int8}
      STT_IDLE_UNLOAD_S: ${STT_IDLE_UNLOAD_S:-600}
      STT_CPU_THREADS: ${STT_CPU_THREADS:-2}
    networks:
      - models
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=4)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    # AD-7 budget for stt: 1.25g. Override with STT_MEM_LIMIT in .env.
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: ${STT_MEM_LIMIT:-1280m}

  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile
      args:
        # Leave empty (default) — nginx on this server proxies /api to backend.
        # Set VITE_API_URL=https://your-backend.com only for split-host deploys.
        VITE_API_URL: ${VITE_API_URL:-}
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - nginx_logs:/var/log/nginx
      # Mount the whole letsencrypt dir, not just live/lorekeeper.quest — the
      # entries under live/ are symlinks into archive/, so archive needs to
      # be present too or the symlinks dangle inside the container.
      - /etc/letsencrypt:/etc/letsencrypt:ro
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256m

networks:
  # internal: no route out of the network and no host port publishing, so
  # the ml and stt sidecars can talk to the backend and nothing else.
  models:
    internal: true

volumes:
  postgres_data:
  valkey_data:
  nginx_logs:
  ollama_data:
  backend_logs:
