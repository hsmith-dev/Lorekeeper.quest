# =============================================================================
# Lorekeeper — Production Docker Compose
#
# Usage:
#   docker compose -f docker-compose.prod.yml up -d --build
#   (scripts/deploy-oci.sh builds the images with `docker buildx bake` from
#   docker-bake.hcl instead, tagged lorekeeper-<svc>:${LOREKEEPER_TAG}.)
#   With an NVIDIA GPU, add the override (speed only; no limit changes):
#   docker compose -f docker-compose.prod.yml -f docker-compose.gpu.yml up -d --build
#
# One profile for a 16 GB box (AD-7): every service's memory limit is a
# *_MEM_LIMIT variable from .env.example, and together they come to 14.5 GiB,
# leaving 1.5 GB for the OS and Docker. CI-14 (scripts/check_memory_budget.py)
# fails the build if the sum goes over or a service here has no limit
# variable. To raise one limit, lower another in the same PR.
#
# Before starting:
#   1. Copy .env.example → .env and fill in all values
#   2. Set ENVIRONMENT=production in .env
#   3. Set CORS_ORIGINS to your actual domain, e.g. ["https://yourdomain.com"]
#   4. Pick an LLM path:
#      a) The bundled `ollama` service below (the default; CPU-only unless you
#         add docker-compose.gpu.yml), reachable internally at
#         http://ollama:11434. See scripts/deploy-oci.sh for the one-time
#         model import step.
#      b) Ollama or KoboldCpp already running on the HOST (e.g. a GPU
#         desktop): set KOBOLD_URL=http://host.docker.internal:11434
#         (KoboldCpp: :5001). `web` and `worker` map that name to the host
#         gateway (extra_hosts below). Then keep the bundled one stopped on
#         every `up` (`--scale ollama=0`, or an override with
#         `ollama: deploy: replicas: 0`; see README) and give the host Ollama
#         the same context / parallel / loaded-model settings as below.
#         OLLAMA_MEM_LIMIT's 5.25g still counts toward the host's 16 GB:
#         the host's own Ollama needs at least that much of the same RAM.
#
# HTTPS works out of the box: if no certificate is mounted, the nginx
#   container generates a self-signed one at startup (see
#   nginx/ensure-certs.sh) — browsers show a one-time warning, fine for
#   local/LAN use. For a real domain, get a Let's Encrypt cert with
#   `certbot certonly --standalone` (stop the nginx container first to free
#   port 80; see docs/OCI_DEPLOYMENT.md's TLS section and
#   scripts/certbot-{pre,post}-hook.sh for renewal) — the nginx service
#   below already mounts /etc/letsencrypt and prefers a real cert when one
#   exists there.
# =============================================================================

services:

  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    # AD-7: shared_buffers sized to the 768m limit, leaving room for
    # per-connection and work_mem memory beside it.
    command: postgres -c shared_buffers=192MB
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Not exposed to host — only web and worker can reach it
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    # Resource ceilings on every service below are respected by plain
    # `docker compose up` on this Compose version, no swarm needed. Memory
    # comes from the AD-7 budget in .env.example.
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: ${POSTGRES_MEM_LIMIT:-768m}

  # Valkey (BSD-3-Clause, Linux Foundation): a drop-in, Redis-compatible
  # server. Replaces redis:7-alpine, which resolves to Redis 7.4+ (RSALv2 /
  # SSPL, not shippable in the commercial edition). The app reaches it at
  # VALKEY_URL (redis:// scheme, redis-py client: that's the wire protocol).
  # Fresh `valkey_data` volume: a Redis 7.4 dump (RDB format 12) can't be read
  # by Valkey 8, and everything stored here is short-lived. See "Upgrading
  # from Redis to Valkey" in README.md.
  valkey:
    image: valkey/valkey:8.1.11-alpine
    restart: unless-stopped
    # AD-7: maxmemory 96mb under the 128m container limit. noeviction on
    # purpose: the RQ queues, Job leases and the LLM gate live here, and
    # silently evicting them would lose work; a full Valkey refuses writes
    # with an error instead.
    command: valkey-server --save 60 1 --loglevel warning --maxmemory 96mb --maxmemory-policy noeviction
    volumes:
      - valkey_data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    # Transitional: the old `redis` hostname still resolves, so an existing
    # .env with REDIS_URL=redis://redis:6379/0 keeps working. Remove once
    # REDIS_URL is gone.
    networks:
      default:
        aliases: [redis]
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: ${VALKEY_MEM_LIMIT:-128m}

  # CPU-served LLM (GPU with docker-compose.gpu.yml). Not exposed to the host
  # — only reachable from other containers on this network at
  # http://ollama:11434. First run needs the `lorekeeper` model installed:
  # Admin → System's model installer, or scripts/deploy-oci.sh's one-time
  # `ollama create lorekeeper -f /import-models/lorekeeper-Modelfile`.
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    # AD-7 / AD-8: one resident model, one request at a time, a fixed
    # context. Every platform LLM task uses the same model (LOCAL_LLM_MODEL),
    # so a second loaded model would only overcommit the 5.25g limit; a
    # Settings or Model Evaluation switch to another model pays a cold load
    # instead (was 2 models / 60m before E0-Platform.7).
    # NUM_PARALLEL is fixed at 1, not read from .env: the 5.25g limit holds
    # one KV cache, and Ollama's 0 ("auto") would open several. Keep the
    # backend's OLLAMA_NUM_PARALLEL (and LLM_GATE_CAPACITY, if set) at 1 to
    # match. CONTEXT_LENGTH is the same .env line the prompt budget reads.
    environment:
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_CONTEXT_LENGTH: ${OLLAMA_CONTEXT_LENGTH:-4096}
      OLLAMA_KEEP_ALIVE: "30m"
    volumes:
      - ollama_data:/root/.ollama
      - ./src/ml/models:/import-models:ro
    healthcheck:
      test: ["CMD-SHELL", "ollama list || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s
    # Memory: AD-7's 5.25g holds one Q4 7B model at a 4096 context. On the
    # E0-QA.15 Reference Box run (4 threads) the runner peaked at 5.08 GB;
    # a 12-thread run was OOM-killed at this limit on a 2k-token prompt, so
    # it is still to be re-checked on the desktop (docs/BENCHMARKS.md).
    #
    # CPU: no cap by default (cpus 0 = unlimited) — llama.cpp generation speed
    # scales with cores, and the old fixed cpus "3.0" held a 24-core host to
    # ~0.7 tok/s, long enough for chat answers to hit KOBOLD_TIMEOUT_SECONDS.
    # Set OLLAMA_CPUS in .env (e.g. OLLAMA_CPUS=6) to reserve cores for other
    # work on a shared host, and then give the model a matching
    # `PARAMETER num_thread` (Ollama starts one thread per HOST core and
    # ignores the quota; see .env.example). Unset or empty falls back to 0.
    deploy:
      resources:
        limits:
          cpus: "${OLLAMA_CPUS:-0}"
          memory: ${OLLAMA_MEM_LIMIT:-5.25g}

  # The API (gunicorn, 4 Uvicorn workers). Called `backend` before
  # E0-Platform.7; that name stays as a network alias so an old .env or a
  # custom nginx config pointing at http://backend:8000 keeps working.
  web:
    # One image for web and worker, built from source (never pulled: Lorekeeper
    # publishes no images). LOREKEEPER_TAG picks the build; deploy-oci.sh sets
    # it, and an old tag is how a rollback runs the previous code.
    image: lorekeeper-web:${LOREKEEPER_TAG:-latest}
    build:
      context: ./src/backend
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    env_file: .env
    environment:
      ENVIRONMENT: production
      # Shared JSON log file all gunicorn workers append to — what the admin
      # portal's System tab (log viewer / support bundle) reads. On a named
      # volume so logs survive container recreation; stdout (docker logs)
      # still gets everything too.
      LOG_FILE: /var/log/lorekeeper/backend.log
    # eval_service.py resolves the validation set at /ml/data/processed/... —
    # correct relative to a full repo checkout, but the backend image's build
    # context is only ./src/backend, so nothing under src/ml ever made it in.
    # Model Evaluation (and its quick-compare buttons) 404'd on this in
    # production with no earlier symptom, since local dev runs against a full
    # checkout where the path just happens to resolve. Mounted read-only —
    # small (~2MB) static training/eval data, never written to at runtime.
    volumes:
      - ./src/ml/data:/ml/data:ro
      - backend_logs:/var/log/lorekeeper
      # Stored files (E0-Jobs.8, FILES_ROOT): written only by
      # app/services/file_service.py, served by nginx (read-only there).
      - files_data:/data/files
      # Pre-upgrade dumps (E0-Platform.9): scripts/boot_migrate.py writes
      # pre-upgrade_<stamp>_<rev>.dump here before a migration runs, and
      # scripts/restore-db.sh reads them back (docs/OCI_DEPLOYMENT.md).
      - backups:/backups
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
    # An LLM on the Docker host (KOBOLD_URL=http://host.docker.internal:...).
    # Docker Desktop resolves the name already; on Linux this maps it.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Upgrade-safe boot before serving (E0-Platform.9): scripts/boot_migrate.py
    # takes a Postgres advisory lock, and when a migration is pending on a
    # database with data it writes a pg_dump to /backups first, then runs
    # `alembic upgrade head`. A failed dump exits non-zero without migrating,
    # so gunicorn never starts on a half-safe upgrade. Deliberately a single line —
    # a folded (`>`) multi-line YAML scalar only folds line breaks to spaces
    # for lines at the *same* indentation as the first content line; any
    # more-indented continuation (as this used to have) is instead kept
    # literal, so `sh -c` received real embedded newlines and every flag
    # after `gunicorn app.main:app` ran as its own bogus one-word command
    # (`sh: -w: not found`, etc.). One line sidesteps the whole footgun.
    # --forwarded-allow-ips="*" is safe here specifically because the API
    # isn't exposed to the host (see the comment below) — nginx is the only
    # thing that can ever reach it, so there's no untrusted peer that could
    # spoof X-Forwarded-For. Without this, gunicorn/UvicornWorker only trusts
    # forwarded headers from a peer at 127.0.0.1 (its own default), so on the
    # compose network every request's "real" IP was actually nginx's
    # container IP — identical for every user. That silently broke: (1) the
    # per-IP @limiter.limit(...) decorators in auth.py, which all bucketed
    # every client together under one shared quota instead of limiting each
    # attacker individually, and (2) any IP that ends up in logs.
    command: sh -c "python scripts/boot_migrate.py && exec gunicorn app.main:app -w 4 -k uvicorn.workers.UvicornWorker --bind 0.0.0.0:8000 --forwarded-allow-ips='*' --timeout 180 --graceful-timeout 30 --access-logfile - --error-logfile -"
    # Not exposed to host — nginx is the only entry point
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    # AD-7: 1g for 4 gunicorn workers. Since E0-Platform.6 no worker loads a
    # model (embeddings, NER and OCR come from `ml`, speech from `stt`), and
    # the image is 141 MiB. The old 14g cap was sized for the in-process
    # models (a measured 11.86 GiB boot peak with all four workers loading
    # spaCy and sentence-transformers at once); that peak is gone with them.
    # The new limit is still to be measured at idle and under load on the
    # desktop.
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: ${WEB_MEM_LIMIT:-1g}
    # `default` for postgres/valkey/ollama/nginx, `models` to reach the ml
    # and stt sidecars.
    networks:
      default:
        aliases: [backend]
      models: {}

  # Background Jobs (E0-Jobs.3): an RQ WorkerPool of WORKER_PROCESSES
  # (default 2) LorekeeperWorker processes on the interactive, onsave and
  # backfill queues (highest priority first). Same image and env as web; it
  # starts after web is healthy, so after its migrations. No ports and no
  # nginx route.
  worker:
    image: lorekeeper-web:${LOREKEEPER_TAG:-latest}
    build:
      context: ./src/backend
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    env_file: .env
    environment:
      ENVIRONMENT: production
    depends_on:
      web:
        condition: service_healthy
    # Jobs call the LLM too: same host-gateway mapping as web.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: python -m app.jobs.worker
    # Jobs write recap audio, Chronicles and map tiles here, and files.gc
    # sweeps it (E0-Jobs.8).
    volumes:
      - files_data:/data/files
    # `docker stop` sends SIGTERM: RQ stops taking Jobs and lets the running
    # ones finish for up to this long, then SIGKILL. A Job killed here stays
    # `running` until the reaper (E0-Jobs.4) requeues it, ~60-90 s later.
    stop_grace_period: 60s
    networks:
      - default
      - models
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: ${WORKER_MEM_LIMIT:-1g}

  # Shared embeddings + NER sidecar (src/services/ml): one copy of MiniLM and
  # en_core_web_trf instead of one per gunicorn worker. Not exposed to the
  # host and no nginx route — only on the internal `models` network, where
  # web and worker reach it at ML_URL (default http://ml:8000). Since
  # E0-Platform.6 they call it for every embedding, NER and OCR request and
  # load no model themselves. Weights are baked into the image; it runs
  # offline.
  ml:
    # Tagged so scripts/sidecar_smoke.sh ml finds it by its default name
    # (lorekeeper-ml:latest when LOREKEEPER_TAG is unset).
    image: lorekeeper-ml:${LOREKEEPER_TAG:-latest}
    build:
      context: ./src/services/ml
      dockerfile: Dockerfile
    restart: unless-stopped
    # Declared-MB budget for the lazy NLI/OCR models (E0-Platform.4); empty
    # keeps the sidecar default (2000).
    environment:
      ML_RESIDENT_BUDGET_MB: ${ML_RESIDENT_BUDGET_MB:-}
    networks:
      - models
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=4)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 180s
    # AD-7: 2.5g for MiniLM + en_core_web_trf resident in one process, plus
    # the lazy NLI/OCR models under ML_RESIDENT_BUDGET_MB (E0-QA.15: the
    # xsmall NLI peaked at 1.23 GB cgroup in this image).
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: ${ML_MEM_LIMIT:-2.5g}

  # faster-whisper speech-to-text sidecar (src/services/stt): one copy of the
  # model instead of openai-whisper in every gunicorn worker. Same rules as
  # ml: no host port, no nginx route, only the internal `models` network,
  # where web and worker reach it at STT_URL (default http://stt:8000).
  # Weights are baked into the image; it runs offline. The model loads on
  # the first request and unloads after STT_IDLE_UNLOAD_S idle.
  # docker-compose.gpu.yml builds its `gpu` target instead.
  stt:
    image: lorekeeper-stt:${LOREKEEPER_TAG:-latest}
    build:
      context: ./src/services/stt
      dockerfile: Dockerfile
      target: cpu
    restart: unless-stopped
    environment:
      STT_COMPUTE_TYPE: ${STT_COMPUTE_TYPE:-int8}
      STT_IDLE_UNLOAD_S: ${STT_IDLE_UNLOAD_S:-600}
      STT_CPU_THREADS: ${STT_CPU_THREADS:-2}
    networks:
      - models
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=4)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    # AD-7: 1.25g (E0-QA.15: base int8 peaked at 0.5 GB cgroup).
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: ${STT_MEM_LIMIT:-1.25g}

  nginx:
    image: lorekeeper-nginx:${LOREKEEPER_TAG:-latest}
    build:
      context: .
      dockerfile: nginx/Dockerfile
      args:
        # Leave empty (default) — nginx on this server proxies /api to web.
        # Set VITE_API_URL=https://your-backend.com only for split-host deploys.
        VITE_API_URL: ${VITE_API_URL:-}
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      web:
        condition: service_healthy
    volumes:
      - nginx_logs:/var/log/nginx
      # Mount the whole letsencrypt dir, not just live/lorekeeper.quest — the
      # entries under live/ are symlinks into archive/, so archive needs to
      # be present too or the symlinks dangle inside the container.
      - /etc/letsencrypt:/etc/letsencrypt:ro
      # Read-only: nginx only serves stored files, through the internal
      # /_files/ location after the app's X-Accel-Redirect (E0-Jobs.8).
      - files_data:/data/files:ro
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: ${NGINX_MEM_LIMIT:-128m}

networks:
  # internal: no route out of the network and no host port publishing, so
  # the ml and stt sidecars can talk to web and worker and nothing else.
  models:
    internal: true

volumes:
  postgres_data:
  valkey_data:
  nginx_logs:
  ollama_data:
  # Keeps its pre-E0-Platform.7 name so existing logs survive the rename.
  backend_logs:
  # Stored files (E0-Jobs.8): backed up with the database by
  # scripts/backup-db.sh (docs/DATABASE_BACKUPS.md).
  files_data:
  # Pre-upgrade dumps (E0-Platform.9), mounted at /backups on web. Pruned to
  # the newest PRE_UPGRADE_BACKUPS_KEEP (default 5) by boot_migrate.py.
  backups:
