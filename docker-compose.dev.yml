# Dev-only compose: runs postgres + redis locally so you can run backend/frontend directly.
# Usage: docker compose -f docker-compose.dev.yml up -d
# Ports bind to 127.0.0.1 by default. Set BIND_IP in .env (e.g. a Tailscale IP)
# to expose them on one specific interface instead. Never use 0.0.0.0 — Docker
# published ports bypass ufw.

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: lorekeeper
      POSTGRES_PASSWORD: changeme
      POSTGRES_DB: lorekeeper
    ports:
      - "${BIND_IP:-127.0.0.1}:5432:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lorekeeper"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "${BIND_IP:-127.0.0.1}:6379:6379"
    volumes:
      - redis_dev_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  postgres_dev_data:
  redis_dev_data:
