# Shared between the HTTP and HTTPS server blocks in nginx.conf — kept in
# one file so the two never drift out of sync with each other.

# ── AI-generation endpoints ──────────────────────────────────────────────────
# Exact-match locations (nginx picks the most specific match over the generic
# /api/ prefix below) for every route that triggers an LLM completion,
# Whisper transcription, or OCR pass — throttled to the `ai_gen` zone
# (10r/m, see nginx.conf) instead of the generic 30r/s `api` zone. Everything
# else under these same routers (GET listing routes, tag creation, etc.)
# still falls through to the generic /api/ location further down.
location = /api/journals/generate-draft {
    limit_req zone=ai_gen burst=5 nodelay;
    limit_req zone=ai_gen_ip burst=20 nodelay;
    include /etc/nginx/proxy_common.conf;
}
location = /api/journals/generate {
    limit_req zone=ai_gen burst=5 nodelay;
    limit_req zone=ai_gen_ip burst=20 nodelay;
    include /etc/nginx/proxy_common.conf;
}
location = /api/journals/autocomplete {
    limit_req zone=ai_gen burst=5 nodelay;
    limit_req zone=ai_gen_ip burst=20 nodelay;
    include /etc/nginx/proxy_common.conf;
}
location = /api/journals/recap {
    limit_req zone=ai_gen burst=5 nodelay;
    limit_req zone=ai_gen_ip burst=20 nodelay;
    include /etc/nginx/proxy_common.conf;
}
location = /api/journals/summarize-session {
    limit_req zone=ai_gen burst=5 nodelay;
    limit_req zone=ai_gen_ip burst=20 nodelay;
    include /etc/nginx/proxy_common.conf;
}
location = /api/chat/ {
    limit_req zone=ai_gen burst=5 nodelay;
    limit_req zone=ai_gen_ip burst=20 nodelay;
    include /etc/nginx/proxy_common.conf;
}
location = /api/chat/stream {
    limit_req zone=ai_gen burst=5 nodelay;
    limit_req zone=ai_gen_ip burst=20 nodelay;
    include /etc/nginx/proxy_common.conf;
    # SSE: deliver tokens as they generate — buffering would hold the whole
    # stream until completion, defeating the endpoint's entire purpose.
    proxy_buffering off;
}
location = /api/session-plans/generate {
    limit_req zone=ai_gen burst=5 nodelay;
    limit_req zone=ai_gen_ip burst=20 nodelay;
    include /etc/nginx/proxy_common.conf;
}
location = /api/settings/test {
    limit_req zone=ai_gen burst=5 nodelay;
    limit_req zone=ai_gen_ip burst=20 nodelay;
    include /etc/nginx/proxy_common.conf;
}
location = /api/settings/evaluate {
    # Runs the full validation set (many completions in one request) —
    # tighter burst than the rest of this zone since a single legitimate
    # call already does the work of several.
    limit_req zone=ai_gen burst=2 nodelay;
    limit_req zone=ai_gen_ip burst=20 nodelay;
    include /etc/nginx/proxy_common.conf;
}
location = /api/ingest/voice {
    limit_req zone=ai_gen burst=5 nodelay;
    limit_req zone=ai_gen_ip burst=20 nodelay;
    include /etc/nginx/proxy_common.conf;
}
location = /api/ingest/image {
    limit_req zone=ai_gen burst=5 nodelay;
    limit_req zone=ai_gen_ip burst=20 nodelay;
    include /etc/nginx/proxy_common.conf;
}

# ── Auth endpoints ────────────────────────────────────────────────────────
location /api/auth/ {
    limit_req zone=auth burst=10 nodelay;
    proxy_pass         http://backend;
    proxy_http_version 1.1;
    proxy_set_header   Connection        "";
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;
}

# ── Everything else under /api/ ──────────────────────────────────────────────
location /api/ {
    limit_req zone=api burst=20 nodelay;
    include /etc/nginx/proxy_common.conf;
}

# ── Frontend static files ────────────────────────────────────────────────────
location / {
    root /usr/share/nginx/html;
    try_files $uri $uri/ /index.html;

    # Cache static assets aggressively
    location ~* \.(js|css|woff2|woff|ttf|ico|png|jpg|svg)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}

# ── Template for future routes (commented out — copy, don't uncomment) ──────
# Shared append point: feature epics add their own blocks here and never
# restructure the file. A route missing from this file silently falls into
# the generic 30r/s `api` zone above, so every new AI/streaming route needs a
# block here AND `@limiter.limit(..., key_func=user_or_ip)` in the app.
#
# AI route with an id in the path → anchored regex location in `ai_gen`
# (exact-match `location =` blocks can't carry a path id):
#
# location ~ ^/api/x/[0-9a-f-]{36}/y$ {
#     limit_req zone=ai_gen burst=5 nodelay;
#     limit_req zone=ai_gen_ip burst=20 nodelay;
#     include /etc/nginx/proxy_common.conf;
# }
#
# Job, event, file and tile routes stay in the generic `api` zone; the ones
# that stream (SSE / chunked) turn buffering off:
#
# location ~ ^/api/jobs/[0-9a-f-]{36}/events$ {
#     limit_req zone=api burst=20 nodelay;
#     include /etc/nginx/proxy_common.conf;
#     proxy_buffering off;
# }
#
# Stored files are served by nginx only via X-Accel-Redirect from the app,
# never requested directly:
#
# location /_files/ {
#     internal;
#     alias /data/files/;
# }
