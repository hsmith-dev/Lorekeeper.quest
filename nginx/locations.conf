# Shared between the HTTP and HTTPS server blocks in nginx.conf — kept in
# one file so the two never drift out of sync with each other.

# ── AI-generation endpoints ──────────────────────────────────────────────────
# Exact-match locations (nginx picks the most specific match over the generic
# /api/ prefix below) for every route that triggers an LLM completion,
# Whisper transcription, or OCR pass — throttled to the `ai_gen` zone
# (10r/m, see nginx.conf) instead of the generic 30r/s `api` zone. Everything
# else under these same routers (GET listing routes, tag creation, etc.)
# still falls through to the generic /api/ location further down.
location = /api/journals/generate-draft {
    limit_req zone=ai_gen burst=5 nodelay;
    limit_req zone=ai_gen_ip burst=20 nodelay;
    include /etc/nginx/proxy_common.conf;
}
location = /api/journals/generate {
    limit_req zone=ai_gen burst=5 nodelay;
    limit_req zone=ai_gen_ip burst=20 nodelay;
    include /etc/nginx/proxy_common.conf;
}
location = /api/journals/autocomplete {
    limit_req zone=ai_gen burst=5 nodelay;
    limit_req zone=ai_gen_ip burst=20 nodelay;
    include /etc/nginx/proxy_common.conf;
}
location = /api/journals/recap {
    limit_req zone=ai_gen burst=5 nodelay;
    limit_req zone=ai_gen_ip burst=20 nodelay;
    include /etc/nginx/proxy_common.conf;
}
location = /api/journals/summarize-session {
    limit_req zone=ai_gen burst=5 nodelay;
    limit_req zone=ai_gen_ip burst=20 nodelay;
    include /etc/nginx/proxy_common.conf;
}
location = /api/chat/ {
    limit_req zone=ai_gen burst=5 nodelay;
    limit_req zone=ai_gen_ip burst=20 nodelay;
    include /etc/nginx/proxy_common.conf;
}
location = /api/chat/stream {
    limit_req zone=ai_gen burst=5 nodelay;
    limit_req zone=ai_gen_ip burst=20 nodelay;
    include /etc/nginx/proxy_common.conf;
    # SSE: deliver tokens as they generate — buffering would hold the whole
    # stream until completion, defeating the endpoint's entire purpose.
    proxy_buffering off;
}
location = /api/session-plans/generate {
    limit_req zone=ai_gen burst=5 nodelay;
    limit_req zone=ai_gen_ip burst=20 nodelay;
    include /etc/nginx/proxy_common.conf;
}
location = /api/settings/test {
    limit_req zone=ai_gen burst=5 nodelay;
    limit_req zone=ai_gen_ip burst=20 nodelay;
    include /etc/nginx/proxy_common.conf;
}
location = /api/settings/evaluate {
    # Runs the full validation set (many completions in one request) —
    # tighter burst than the rest of this zone since a single legitimate
    # call already does the work of several.
    limit_req zone=ai_gen burst=2 nodelay;
    limit_req zone=ai_gen_ip burst=20 nodelay;
    include /etc/nginx/proxy_common.conf;
}
location = /api/ingest/voice {
    limit_req zone=ai_gen burst=5 nodelay;
    limit_req zone=ai_gen_ip burst=20 nodelay;
    include /etc/nginx/proxy_common.conf;
}
location = /api/ingest/image {
    limit_req zone=ai_gen burst=5 nodelay;
    limit_req zone=ai_gen_ip burst=20 nodelay;
    include /etc/nginx/proxy_common.conf;
}

# ── Auth endpoints ────────────────────────────────────────────────────────
location /api/auth/ {
    limit_req zone=auth burst=10 nodelay;
    proxy_pass         http://backend;
    proxy_http_version 1.1;
    proxy_set_header   Connection        "";
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;
}

# ── Campaign events (E0-Access.11) ───────────────────────────────────────────
# GET /api/campaigns/{id}/events: a long-lived SSE stream of invalidations.
# Generic `api` zone (AD-20: event routes are not AI routes); buffering off so
# each frame reaches the browser at once (the app also sends
# X-Accel-Buffering: no, which nginx honours: it is not in
# proxy_ignore_headers). A 15 s ping keeps the 1 h read timeout from firing
# on an idle stream; the client reconnects whenever the stream ends. The
# proxy lines are spelled out instead of including proxy_common.conf, whose
# proxy_read_timeout would be a duplicate directive here. The regex is quoted:
# an unquoted `{36}` would end the token (nginx reads `{` as a block).
location ~ "^/api/campaigns/[0-9a-fA-F-]{36}/events$" {
    limit_req zone=api burst=20 nodelay;
    proxy_pass         http://backend;
    proxy_http_version 1.1;
    proxy_set_header   Connection        "";
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_buffering    off;
    proxy_cache        off;
    gzip               off;
    proxy_connect_timeout 10s;
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;
}

# ── Everything else under /api/ ──────────────────────────────────────────────
location /api/ {
    limit_req zone=api burst=20 nodelay;
    include /etc/nginx/proxy_common.conf;
}

# ── Stored files (E0-Jobs.8) ─────────────────────────────────────────────────
# The bytes behind GET /api/files/{id} (and E10's tile route). `internal`: a
# browser asking for /_files/... directly gets nginx's 404; only the app's
# X-Accel-Redirect reaches it, after its access check. `^~` so no regex
# location (the static-asset one) can ever take an internal redirect.
# files_data is mounted read-only here (docker-compose.prod.yml).
#
# nginx keeps only Content-Type, Content-Disposition and Cache-Control from
# an X-Accel-Redirect response, and an add_header here disables the server
# block's own, so this location re-adds the app's ETag and Vary and the
# security headers itself. nginx's own ETag and Last-Modified validation is
# off: the app's ETag carries the access epoch and the app answers 304.
location ^~ /_files/ {
    internal;
    alias /data/files/;
    etag off;
    if_modified_since off;
    # The app always sets the type; anything it did not is a download.
    types { }
    default_type application/octet-stream;
    add_header ETag                        $upstream_http_etag always;
    add_header Vary                        $upstream_http_vary always;
    add_header X-Content-Type-Options      "nosniff" always;
    add_header Content-Security-Policy     "default-src 'none'; sandbox" always;
    add_header Strict-Transport-Security   "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options             "DENY" always;
    add_header Referrer-Policy             "no-referrer" always;
}

# ── Frontend static files ────────────────────────────────────────────────────
location / {
    root /usr/share/nginx/html;
    try_files $uri $uri/ /index.html;

    # Cache static assets aggressively
    location ~* \.(js|css|woff2|woff|ttf|ico|png|jpg|svg)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}

# ── Template for future routes (commented out — copy, don't uncomment) ──────
# Shared append point: feature epics add their own blocks here and never
# restructure the file. A route missing from this file silently falls into
# the generic 30r/s `api` zone above, so every new AI/streaming route needs a
# block here AND `@limiter.limit(..., key_func=user_or_ip)` in the app.
#
# AI route with an id in the path → anchored regex location in `ai_gen`
# (exact-match `location =` blocks can't carry a path id):
#
# location ~ "^/api/x/[0-9a-f-]{36}/y$" {   # quoted: `{` ends an unquoted token
#     limit_req zone=ai_gen burst=5 nodelay;
#     limit_req zone=ai_gen_ip burst=20 nodelay;
#     include /etc/nginx/proxy_common.conf;
# }
#
# Job, event, file and tile routes stay in the generic `api` zone; the ones
# that stream (SSE / chunked) turn buffering off:
#
# location ~ "^/api/jobs/[0-9a-f-]{36}/events$" {
#     limit_req zone=api burst=20 nodelay;
#     include /etc/nginx/proxy_common.conf;
#     proxy_buffering off;
# }
#
# Stored files are served by nginx only via X-Accel-Redirect from the app,
# never requested directly:
#
# location /_files/ {
#     internal;
#     alias /data/files/;
# }
