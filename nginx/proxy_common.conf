# Shared proxy directives for every /api/ location — pulled out so the new
# per-endpoint AI-generation locations in locations.conf don't have to repeat
# these seven lines each. Long read/send timeouts throughout because even the
# *generic* api location needs to tolerate a slow LLM completion — the
# per-location limit_req is what actually differentiates "cheap CRUD route"
# from "triggers an AI completion", not the timeout.
proxy_pass         http://backend;
proxy_http_version 1.1;
proxy_set_header   Connection        "";
proxy_set_header   Host              $host;
proxy_set_header   X-Real-IP         $remote_addr;
proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header   X-Forwarded-Proto $scheme;
# 600s, not 180s — a long journal-narrative generation on a CPU-served 7B
# model (both the OCI ARM box and a local Docker Desktop run) can legitimately
# exceed 3 minutes; 180s was 504ing those mid-generation. The ai_gen
# limit_req zone is what guards against abuse, not this timeout.
proxy_read_timeout 600s;
proxy_connect_timeout 10s;
proxy_send_timeout 600s;
