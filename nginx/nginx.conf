worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ── Logging ────────────────────────────────────────────────────────────────
    log_format json_combined escape=json
        '{"ts":"$time_iso8601",'
        '"ip":"$remote_addr",'
        '"method":"$request_method",'
        '"uri":"$request_uri",'
        '"status":$status,'
        '"bytes":$body_bytes_sent,'
        '"ref":"$http_referer",'
        '"ua":"$http_user_agent",'
        '"rt":"$request_time"}';
    access_log /var/log/nginx/access.log json_combined;

    # ── Performance ────────────────────────────────────────────────────────────
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/javascript application/json
               application/javascript application/x-javascript
               text/xml application/xml application/xml+rss
               image/svg+xml font/woff2;

    # ── Rate limiting zones ────────────────────────────────────────────────────
    # Bucket key for the `ai_gen` zone: per bearer token, not per IP. A GM and
    # their Players usually share one home router (one NAT address), so an IP
    # key throttles the whole table as one client. nginx core has no hash
    # function, so the JWT's third segment stands in for one: it is the
    # HMAC-SHA256 signature over header and payload — unique per token, short
    # and not the token itself. A forged bearer gets its own bucket here and a
    # 401 from the app (during dependency resolution, before slowapi counts
    # it), so the per-IP `ai_gen_ip` zone below is what bounds such floods.
    # Anything that isn't a three-segment Bearer JWT falls back to the IP.
    # $lk_rate_key / $lk_sig are never referenced in a log_format: neither
    # the bearer nor its signature is ever logged.
    map $http_authorization $lk_rate_key {
        "~*^Bearer\s+[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\.(?<lk_sig>[A-Za-z0-9_-]+)$" $lk_sig;
        default $binary_remote_addr;
    }

    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/m;
    # Endpoints that trigger an LLM completion, a Whisper transcription, or
    # an OCR pass — real compute cost against the self-hosted Ollama/Whisper
    # containers, not just a cheap DB round-trip like the rest of /api/.
    # These previously shared the generic 30r/s `api` zone, which is fine
    # for CRUD but does nothing to stop someone (or a buggy client retry
    # loop) from hammering the AI backend hard enough to starve it for
    # every other user. See locations.conf's dedicated `location` blocks for
    # exactly which routes this applies to. Keyed per bearer token (see the
    # $lk_rate_key map above), with the app's slowapi user_or_ip limits giving
    # the exact per-user bucket behind it.
    limit_req_zone $lk_rate_key zone=ai_gen:10m rate=10r/m;
    # Per-IP backstop applied alongside `ai_gen` on every AI location: a
    # client minting a new random Bearer per request would otherwise get a
    # fresh `ai_gen` bucket each time. Set at 6x the per-user rate so a table
    # of several Players behind one NAT still fits under it.
    limit_req_zone $binary_remote_addr zone=ai_gen_ip:10m rate=60r/m;
    limit_req_status 429;

    # ── Upstream ───────────────────────────────────────────────────────────────
    upstream backend {
        server backend:8000;
        keepalive 32;
    }

    server {
        listen 80;
        server_name lorekeeper.quest www.lorekeeper.quest;

        # Everything on plain HTTP just goes to HTTPS — certbot's standalone
        # renewal (see scripts/renew-cert-hooks/) stops nginx briefly instead
        # of needing a `.well-known/acme-challenge` location here.
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl http2;
        server_name lorekeeper.quest www.lorekeeper.quest;

        # Populated by the entrypoint script (nginx/ensure-certs.sh): a
        # symlink to whatever Let's Encrypt cert is mounted under
        # /etc/letsencrypt/live/<domain>/, or a generated self-signed pair
        # when nothing is — so a fresh clone boots with HTTPS everywhere
        # instead of crash-looping on missing cert files.
        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        # ── Security headers ───────────────────────────────────────────────────
        add_header Strict-Transport-Security   "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options             "SAMEORIGIN"                   always;
        add_header X-Content-Type-Options      "nosniff"                      always;
        add_header X-XSS-Protection            "1; mode=block"                always;
        add_header Referrer-Policy             "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy          "camera=(), microphone=(), geolocation=()" always;
        # script-src dropped 'unsafe-inline' — verified the built frontend
        # (dist/index.html) only ever emits <script src="..."> tags (Vite's
        # module entry + the PWA registerSW.js), never inline script content,
        # so nothing depends on it. This is the directive that actually
        # matters for XSS: the JWT lives in localStorage (see useAuth.ts),
        # so a successful inline-script injection would be a straight token
        # theft — this closes that off at the browser level regardless of
        # what a future XSS bug elsewhere might let through. style-src keeps
        # 'unsafe-inline' — React sets inline style="" attributes throughout
        # (font-family theming etc.) and removing it needs a real test pass,
        # not a drive-by change.
        add_header Content-Security-Policy
            "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data:; connect-src 'self';"
            always;

        # ── Client limits ──────────────────────────────────────────────────────
        # Was 2m — silently 413'd every upload the backend itself allows past
        # 2MB: avatars (5MB, app/api/routes/auth.py), source documents (15MB,
        # sources.py), ingested images (10MB) and session-recording audio
        # (25MB, both ingest.py). nginx rejected those before the backend's
        # own size checks ever ran, so session-recording audio in particular
        # was very likely failing in production for any chunk over 2MB. Set
        # to the largest of those limits so nginx is never the bottleneck
        # below what the backend already intends to accept.
        client_max_body_size 25m;

        include /etc/nginx/locations.conf;
    }
}
