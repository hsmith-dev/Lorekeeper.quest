name: Dependency licences

# Lorekeeper is AGPL-3.0 *and* sold under a proprietary commercial licence, so
# everything we ship must be distributable under both. licenses/register.yaml
# is the inventory (packages, images, apt libraries, models, voices, fonts);
# .github/license-policy.toml holds the rules (allowlist, aliases, deny lists,
# [strict] edition rules, owner-approved exceptions). Each scan runs once per
# edition (LOREKEEPER_EDITION): `commercial` is strict, `agpl` additionally
# allows GPL-family entries that ship only in the AGPL-only `tts` image.
on:
  push:
    branches: [main]
  pull_request:
  # Weekly: the shipped images float on their base tags (python:3.11-slim,
  # nginx:1.27-alpine), so a base-image rebuild can add an OS package nobody
  # registered without any change in this repo.
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        edition: [agpl, commercial]
    env:
      LOREKEEPER_EDITION: ${{ matrix.edition }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: src/backend/requirements.txt

      # Only runtime requirements: requirements-dev.txt (pytest etc.) is never
      # distributed, so of it only the checker's pyyaml is installed (it is
      # also a runtime transitive, so it adds nothing unregistered). CPU-only
      # torch wheels keep the install small; their licence metadata is
      # identical to the CUDA build, but the CUDA build's NVIDIA wheels are
      # never seen here (E0-QA.8 scans the real images).
      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --extra-index-url https://download.pytorch.org/whl/cpu \
            -r src/backend/requirements.txt
          pip install -r <(grep -i '^pyyaml' src/backend/requirements-dev.txt)

      # Reads installed package metadata directly (PEP 639 License-Expression,
      # then classifiers). pip-licenses 5.0 ignores License-Expression and
      # reports ~40 modern packages as UNKNOWN.
      - name: Check against register and policy (${{ matrix.edition }})
        run: python scripts/check-licenses.py --python-env --register licenses/register.yaml --artifact backend

  frontend:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        edition: [agpl, commercial]
    env:
      LOREKEEPER_EDITION: ${{ matrix.edition }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install checker dependency
        run: pip install -r <(grep -i '^pyyaml' src/backend/requirements-dev.txt)

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: src/frontend/package-lock.json

      # Includes devDependencies on purpose: build tooling (Vite, Tailwind,
      # the PWA plugin) injects code/CSS into the shipped bundle.
      - name: Install dependencies
        working-directory: src/frontend
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Collect licences
        working-directory: src/frontend
        run: npx --yes license-checker-rseidelsohn@4.4.2 --json --excludePrivatePackages > "$GITHUB_WORKSPACE/npm-licenses.json"

      - name: Check against register and policy (${{ matrix.edition }})
        run: python scripts/check-licenses.py --npm npm-licenses.json --register licenses/register.yaml --artifact nginx

  # Register-vs-artifacts: every model/voice/font entry has an artifact path
  # or download URL plus sha256, tracked artifacts match their hash, and a
  # baked artifact (font, weights) with no register entry fails. Also runs the
  # checker's unit tests.
  register:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install checker dependencies
        run: pip install -r <(grep -iE '^(pyyaml|pytest)==' src/backend/requirements-dev.txt)

      - name: Checker unit tests
        run: python -m pytest -q scripts/test_check_licenses.py

      - name: Register vs artifacts (both editions)
        run: |
          python scripts/check-licenses.py --check-artifacts --register licenses/register.yaml --edition agpl
          python scripts/check-licenses.py --check-artifacts --register licenses/register.yaml --edition commercial

  # E0-QA.8: build every image we ship and scan it from the inside, so what is
  # checked is what is distributed: the image's real pip set (the backend
  # build, not the runner's CI install above) and its OS packages (dpkg plus
  # /usr/share/doc/*/copyright on Debian, the apk database on Alpine). The
  # checker, register and policy are mounted read-only, never installed into
  # the image. Upstream images we only reference in compose (postgres, redis,
  # ollama) are not built here; they are image entries in the register.
  image-licenses:
    name: image-licenses (${{ matrix.image }})
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        # One line per shipped image (adding the ml / stt / tts images is one
        # line each). python: run the checker inside the image (pip + OS
        # packages); false: export the image filesystem and scan its OS
        # packages from the runner. editions: the legs the image ships in
        # (the AGPL-only tts image gets "agpl").
        include:
          - { image: backend, context: src/backend, dockerfile: src/backend/Dockerfile.prod, python: true, editions: "agpl commercial" }
          - { image: nginx, context: ".", dockerfile: nginx/Dockerfile, python: false, editions: "agpl commercial" }
          - { image: ml, context: src/services/ml, dockerfile: src/services/ml/Dockerfile, python: true, editions: "agpl commercial" }
    steps:
      - uses: actions/checkout@v4

      # The backend image (CPU torch, transformers, spaCy en_core_web_trf) is
      # several GB, and buildx --load holds it twice; the runner's preinstalled
      # SDKs are not needed here.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.image }} image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          load: true
          push: false
          tags: lorekeeper-${{ matrix.image }}:licence-scan
          cache-from: type=gha,scope=image-${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=image-${{ matrix.image }}

      - uses: actions/setup-python@v5
        if: ${{ !matrix.python }}
        with:
          python-version: "3.11"

      - name: Install checker dependency (runner-side scan)
        if: ${{ !matrix.python }}
        run: pip install -r <(grep -i '^pyyaml' src/backend/requirements-dev.txt)

      - name: Scan image (${{ matrix.editions }})
        env:
          IMAGE: ${{ matrix.image }}
          TAG: lorekeeper-${{ matrix.image }}:licence-scan
          IN_IMAGE: ${{ matrix.python }}
          EDITIONS: ${{ matrix.editions }}
        run: |
          set -u
          if [ "$IN_IMAGE" != "true" ]; then
            root="$RUNNER_TEMP/rootfs-$IMAGE"
            mkdir -p "$root"
            cid=$(docker create "$TAG")
            # Device nodes etc. cannot be recreated unprivileged, so tar errors
            # are shown but not fatal; the package databases and docs are
            # plain files, and the checker fails on a missing or empty one.
            docker export "$cid" | tar -x -C "$root" --no-same-owner \
              || echo "::warning::tar reported errors extracting the $IMAGE filesystem (see above)"
            docker rm "$cid" >/dev/null
          fi
          rc=0
          for edition in $EDITIONS; do
            echo "::group::$IMAGE image, $edition edition"
            if [ "$IN_IMAGE" = "true" ]; then
              docker run --rm --network none --entrypoint python \
                -e LOREKEEPER_EDITION="$edition" -e GITHUB_ACTIONS \
                -v "$PWD/scripts:/chk:ro" -v "$PWD/licenses:/lic:ro" -v "$PWD/.github:/pol:ro" \
                "$TAG" /chk/check-licenses.py --policy /pol/license-policy.toml \
                --register /lic/register.yaml --python-env --os-packages \
                --artifact "$IMAGE" --emit-missing || rc=1
            else
              LOREKEEPER_EDITION="$edition" python scripts/check-licenses.py \
                --register licenses/register.yaml --os-packages "$root" \
                --artifact "$IMAGE" --emit-missing || rc=1
            fi
            echo "::endgroup::"
          done
          exit $rc
