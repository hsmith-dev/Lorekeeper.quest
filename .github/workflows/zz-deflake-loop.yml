name: Deflake loop (TEMPORARY, fix/deflake-grant-stream)

on:
  pull_request:

jobs:
  loop:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: lorekeeper
          POSTGRES_PASSWORD: changeme
          POSTGRES_DB: lorekeeper_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            src/backend/requirements.txt
            src/backend/requirements-dev.txt
      - name: Install
        working-directory: src/backend
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends stress-ng \
            libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz0b fontconfig fonts-dejavu-core fonts-dejavu-extra
          python -m pip install --upgrade pip
          pip install --no-cache-dir -r requirements.txt -r requirements-dev.txt pytest-repeat==0.9.3
      - name: Loop the mid-stream tests under CPU stress
        working-directory: src/backend
        env:
          DATABASE_URL: postgresql+asyncpg://lorekeeper:changeme@localhost:5432/lorekeeper_test
          TEST_DATABASE_URL: postgresql+asyncpg://lorekeeper:changeme@localhost:5432/lorekeeper_test
          POSTGRES_PASSWORD: changeme
          SECRET_KEY: ci-test-secret-key-not-used-anywhere-real
        run: |
          set -o pipefail
          stress-ng --cpu "$(nproc)" --io 2 --timeout 0 >/dev/null 2>&1 &
          python -m pytest tests/test_pubsub.py -k "cancel or wait_for" -p no:cacheprovider -q -rf 2>&1 | tail -40
          python -m pytest tests/access/test_grants.py -k "mid_stream or grant_watches or before_the_stream or unchanged_stream" \
            --count 200 -p no:cacheprovider -q -rf 2>&1 | tail -60
