name: Backend tests

# Runs the pytest suite in src/backend against a real pgvector-enabled
# Postgres service container — nothing was running these on push before this
# workflow existed. No `paths:` filters (AD-21, NFR-4): a required check that
# is skipped on some PRs is no gate, so every push and PR runs it.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        # Same image used in local dev (docker-compose.yml) and prod — a
        # plain `postgres` image doesn't have the `vector` extension
        # conftest.py's setup_test_db fixture needs (CREATE EXTENSION
        # IF NOT EXISTS vector).
        image: pgvector/pgvector:pg16
        env:
          # Both DATABASE_URL and TEST_DATABASE_URL in the "Run tests" step
          # below must match these values (user, password and database
          # name) — tests/conftest.py connects via TEST_DATABASE_URL and the
          # app's own engine via DATABASE_URL, so they aren't arbitrary.
          POSTGRES_USER: lorekeeper
          POSTGRES_PASSWORD: changeme
          POSTGRES_DB: lorekeeper_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      valkey:
        # For the `real` parametrisation of tests/test_llm_gate.py (Lua,
        # ZSETs against a real server). Same pinned tag as the compose files:
        # Valkey (BSD-3-Clause) replaced Redis, whose 7.4+ is RSALv2/SSPL.
        image: valkey/valkey:8.1.11-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            src/backend/requirements.txt
            src/backend/requirements-dev.txt

      - name: Install dependencies
        working-directory: src/backend
        run: |
          python -m pip install --upgrade pip
          # CPU-only torch, exactly as the shipped image installs it (E0-Platform.2).
          # The PyPI default is the CUDA build: ~15 nvidia-* wheels, several GB,
          # which filled the runner's disk and made the job fail before any test ran.
          pip install --no-cache-dir --index-url https://download.pytorch.org/whl/cpu \
            torch==2.15.0+cpu torchvision==0.29.2+cpu
          pip install --no-cache-dir --extra-index-url https://download.pytorch.org/whl/cpu \
            -r requirements.txt -r requirements-dev.txt
          # Guard: fail fast if anything pulled a CUDA build back in.
          if pip list 2>/dev/null | grep -iE '^(nvidia-|cuda-)'; then
            echo "::error::CUDA/NVIDIA wheels installed in backend CI; use the CPU index"; exit 1
          fi

      # Two heads would make `alembic upgrade head` fail on every boot.
      # tests/migrations/test_upgrade_snapshot.py checks this too; this step
      # fails fast, before the spaCy model download and the test run. It reads
      # only the scripts in migrations/versions (no database, no env.py).
      - name: Single Alembic head
        working-directory: src/backend
        run: |
          heads="$(python -m alembic heads)"
          echo "$heads"
          if [ "$(printf '%s\n' "$heads" | grep -c .)" -ne 1 ]; then
            echo "::error::Expected exactly one Alembic head, found:"
            echo "$heads"
            exit 1
          fi

      - name: Download spaCy model
        # tests/test_nlp.py loads this directly (see its load_model fixture)
        # — same model app/services/nlp_service.py uses in production.
        working-directory: src/backend
        run: python -m spacy download en_core_web_trf

      - name: Run tests
        working-directory: src/backend
        env:
          DATABASE_URL: postgresql+asyncpg://lorekeeper:changeme@localhost:5432/lorekeeper_test
          TEST_DATABASE_URL: postgresql+asyncpg://lorekeeper:changeme@localhost:5432/lorekeeper_test
          POSTGRES_PASSWORD: changeme
          SECRET_KEY: ci-test-secret-key-not-used-anywhere-real
          # DB 15 so the gate tests never share a keyspace with anything else.
          VALKEY_TEST_URL: redis://localhost:6379/15
        run: python -m pytest -v
