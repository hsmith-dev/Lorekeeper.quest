# Dependency licence policy, enforced by scripts/check-licenses.py
# (.github/workflows/license-check.yml).
#
# Lorekeeper is AGPL-3.0 AND sold under a proprietary commercial licence
# (COMMERCIAL-LICENSE.md). The commercial side is what constrains us: anything
# we ship must be usable in a closed-source product. So only permissive
# licences are allowed; copyleft (GPL/AGPL/LGPL), non-commercial (CC-BY-NC),
# ethical-use (Hippocratic) and unknown licences fail unless an exception
# below records why that specific package is fine.
#
# licenses/register.yaml is the inventory of everything shipped (packages,
# images, apt libraries, models, voices, fonts). With --register the checker
# also requires a register entry per scanned package and applies the edition
# rules in [strict] below (LOREKEEPER_EDITION = agpl | commercial). This file
# stays the rule file: allowlist, aliases, deny lists, exceptions.

[allow]
# SPDX ids (case-insensitive). Expressions are evaluated: "A OR B" passes if
# either side is allowed, "A AND B" only if both are.
licenses = [
  "MIT", "MIT-0", "MIT-CMU",
  "BSD-2-Clause", "BSD-3-Clause", "0BSD",
  "Apache-2.0",
  "ISC",
  "PSF-2.0", "Python-2.0",
  "Zlib",
  "Unlicense", "CC0-1.0",
  "BlueOak-1.0.0",
  "HPND",
  "BSL-1.0",  # Boost
  "CNRI-Python",
  # MPL-2.0 is file-level copyleft: fine to depend on unmodified. If we ever
  # patch an MPL file, that file's changes must be published.
  "MPL-2.0",
  # MPL-1.1, the same file-level terms: Pyphen (WeasyPrint's hyphenation,
  # E0-QA.9) is GPL-2.0+ OR LGPL-2.1+ OR MPL-1.1 and is used under MPL-1.1.
  "MPL-1.1",
  "PostgreSQL",  # PostgreSQL / pgvector
  "OFL-1.1",     # SIL Open Font License 1.1 (fonts)
  # Permissive licences of OS packages in the shipped images (E0-QA.8)
  "curl", "X11", "Libpng", "libtiff", "IJG", "bzip2-1.0.6", "GD", "FTL", "Beerware",
  "LicenseRef-Public-Domain", "TCL",
  # AV1 (libaom): royalty-free patent grant that permits commercial use
  "LicenseRef-AOM-Patent-License-1.0",
  # WeasyPrint's apt fonts and font config (E0-QA.9). Bitstream Vera (DejaVu):
  # use, embed and redistribute freely, renamed if modified, not sold on its
  # own. HPND-sell-variant: fontconfig's permissive MIT-style licence.
  "Bitstream-Vera", "HPND-sell-variant",
]

[aliases]
# Free-text licence strings (trove classifiers, metadata) -> SPDX id.
"MIT License" = "MIT"
"The MIT License" = "MIT"
"MIT license" = "MIT"
"BSD License" = "BSD-3-Clause"
"BSD" = "BSD-3-Clause"
"3-Clause BSD License" = "BSD-3-Clause"
"BSD 3-Clause" = "BSD-3-Clause"
"New BSD License" = "BSD-3-Clause"
"Modified BSD License" = "BSD-3-Clause"
"BSD-3-Clause license" = "BSD-3-Clause"
"Apache Software License" = "Apache-2.0"
"Apache License 2.0" = "Apache-2.0"
"Apache 2.0" = "Apache-2.0"
"Apache 2.0 License" = "Apache-2.0"
"Apache License" = "Apache-2.0"
"Boost Software License 1.0 (BSL-1.0)" = "BSL-1.0"
"Apache-2" = "Apache-2.0"
"Apache License, Version 2.0" = "Apache-2.0"
"Apache Software License 2.0" = "Apache-2.0"
"ISC License (ISCL)" = "ISC"
"ISC License" = "ISC"
"Python Software Foundation License" = "PSF-2.0"
"PSF" = "PSF-2.0"
"Mozilla Public License 2.0 (MPL 2.0)" = "MPL-2.0"
"The Unlicense (Unlicense)" = "Unlicense"
"Historical Permission Notice and Disclaimer (HPND)" = "HPND"
"zlib/libpng License" = "Zlib"
# OS package metadata (Alpine `L:` fields, Debian DEP-5 short names)
"Public-Domain" = "LicenseRef-Public-Domain"
"Public Domain" = "LicenseRef-Public-Domain"
"public-domain" = "LicenseRef-Public-Domain"
"Expat" = "MIT"
"2-clause BSD-like license" = "BSD-2-Clause"

[deny]
# Purely for clearer error messages: anything not allowed already fails.
patterns = [
  "\\bA?GPL", "\\bLGPL", "General Public License",
  "\\bNC\\b", "NonCommercial", "Non-Commercial",
  "Hippocratic",
  "\\bSSPL\\b", "Commons Clause", "BUSL", "Business Source",
  "UNKNOWN", "UNLICENSED", "Custom",
]

[deny.packages]
# Denied outright in --register mode, whatever licence they report.
# pyvips[binary] bundles a statically built libvips; use apt libvips instead.
python = ["pyvips-binary"]

[strict]
# Edition rules for --register (scripts/check-licenses.py). Both editions fail
# on non-commercial, ethical-use, proprietary or unknown licences. The
# commercial edition (strict) also fails on GPL/AGPL/LGPL, except LGPL apt
# system libraries on system_lib_allowlist (dynamically linked). The agpl
# edition allows GPL-family entries only with editions = [agpl] and an
# `images` list inside agpl_only_images.
gpl_patterns = [
  "\\bA?GPL", "\\bLGPL", "General Public License", "GNU Library",
]
# The LGPL subset of the above: each consumes only the LGPL phrase (plus an
# optional version / "or later" / "(LGPL...)" suffix), so whatever GPL text is
# left over (e.g. "... AND GNU General Public License v3") still classifies as GPL.
lgpl_patterns = [
  "GNU Library or Lesser General Public License( \\(LGPL\\))?",
  "(GNU )?(Lesser|Library) General Public License( v?[\\d.]+\\+?)?( or later)?( \\(LGPL[^)]*\\))?",
  "\\bLGPL[-\\w.+]*",
]
bad_patterns = [
  "\\bNC\\b", "-NC-", "NonCommercial", "Non-Commercial",
  "Hippocratic",
  "\\bSSPL\\b", "RSAL", "Commons Clause", "BUSL", "Business Source",
  "Proprietary", "NVIDIA", "CPML",
  "UNKNOWN", "UNLICENSED", "Custom",
]
# apt package-name regexes: dynamically linked LGPL system libraries that the
# commercial edition may ship (libvips from apt, Pango, HarfBuzz, GLib).
# Shipped unmodified from Debian; never vendored, patched or statically linked.
system_lib_allowlist = [
  "^libvips\\d*(-|$)", "^(lib)?pango", "^libharfbuzz", "^libglib2",
  # Pango's own dependencies, pulled in for WeasyPrint (E0-QA.9), reviewed:
  # FriBidi (bidi algorithm), libthai + its dictionary data and libdatrie
  # (Thai line breaking) are LGPL-2.1+; their GPL-2+ is debian/ packaging
  # only. Graphite2 is LGPL-2.1+ OR MPL-1.1 OR GPL-2+, used under LGPL-2.1+.
  "^libfribidi\\d+$", "^libthai(\\d+|-data)$", "^libdatrie\\d+$", "^libgraphite2-\\d+$",
]
# Images that exist only in the AGPL build (the optional TTS container).
agpl_only_images = ["tts"]
# OS-base-layer rule (E0-QA.8, docs/LICENSING.md). apt/apk package-name
# regexes for GPL/LGPL operating-system packages that ship unmodified, as
# separate programs and libraries of the image's distribution (Debian for
# backend, Alpine for nginx): shells, core utilities, the C library, the
# compiler toolchain build-essential installs, the package manager. Shipping
# them next to Lorekeeper in one image is mere aggregation: Lorekeeper does
# not modify them, and no Lorekeeper code is a derivative work of them.
# Obligations: licence texts ship in the image (/usr/share/doc/*/copyright,
# /usr/share/licenses), and corresponding source comes from the distribution
# archive (docs/LICENSING.md). Both editions accept these; non-commercial,
# proprietary and unknown licences still fail. A package not listed here (a
# GPL library a new apt install pulls in) fails until it is reviewed and
# added. Every package still needs its register entry.
os_aggregate_allowlist = [
  # --- Alpine (nginx image) ---
  # base layout, package manager, busybox (sh and the core utilities) and its TLS helper
  "^alpine-baselayout(-data)?$", "^apk-tools$", "^busybox(-binsh)?$", "^ssl_client$", "^scanelf$",
  "^musl-utils$",
  # envsubst, run by the nginx image's own entrypoint for config templates
  "^gettext-envsubst$",
  # LGPL / dual-licensed libraries that nginx and its modules load dynamically
  # (geoip; libgcrypt via libxslt; libidn2 via libcurl); not linked by Lorekeeper
  "^geoip$", "^libintl$", "^libgcrypt$", "^libgpg-error$", "^libidn2$", "^libunistring$",
  "^xz-libs$",
  # --- Debian (backend image: python:3.11-slim + build-essential + libpq-dev) ---
  # Debian's DEP-5 copyright files list every licence in the SOURCE package
  # (build scripts, docs, tests), so nearly every package reads as GPL/LGPL.
  # shells, core utilities, login and init helpers
  "^bash$", "^dash$", "^coreutils$", "^findutils$", "^diffutils$", "^grep$", "^sed$", "^mawk$",
  "^gzip$", "^tar$", "^bzip2$", "^xz-utils$", "^hostname$", "^util-linux$", "^bsdutils$",
  "^mount$", "^login(\\.defs)?$", "^passwd$", "^adduser$", "^sysvinit-utils$",
  "^init-system-helpers$", "^debianutils$", "^base-(files|passwd)$", "^netbase$", "^tzdata$",
  "^ca-certificates$", "^ncurses-(base|bin)$", "^readline-common$",
  # package management
  "^dpkg(-dev)?$", "^libdpkg-perl$", "^apt$", "^libapt-pkg[\\d.]+$", "^debconf$",
  "^libdebconfclient\\d+$", "^debian-archive-keyring$", "^sqv$",
  # C library, compiler runtime (GCC Runtime Library Exception) and kernel headers
  "^libc6(-dev)?$", "^libc-(bin|dev-bin)$", "^libcrypt(1|-dev)$", "^linux-libc-dev$",
  "^rpcsvc-proto$", "^gcc-\\d+-base$", "^libgcc-s\\d+$", "^libstdc\\+\\+\\d+$",
  # build-essential toolchain (only needed for the arm64 spaCy source build;
  # a multi-stage Dockerfile.prod would drop all of these, docs/LICENSING.md)
  "^build-essential$", "^(gcc|g\\+\\+|cpp)(-\\d+)?(-x86-64-linux-gnu|-aarch64-linux-gnu)?$",
  "^binutils(-common|-x86-64-linux-gnu|-aarch64-linux-gnu)?$", "^libbinutils$",
  "^libctf(-nobfd)?\\d+$", "^libsframe\\d+$", "^libgprofng\\d+$", "^libjansson\\d+$",
  "^lib(asan|atomic|cc1-|gomp|hwasan|itm|lsan|quadmath|tsan|ubsan)\\d+$",
  "^lib(gcc|stdc\\+\\+)-\\d+-dev$", "^libisl\\d+$", "^libmpc\\d+$", "^libmpfr\\d+$",
  "^make$", "^patch$", "^perl(-base|-modules-[\\d.]+)?$", "^libperl[\\d.]+$",
  # system libraries of the base image (Python, apt, PAM, Kerberos and libpq load them)
  "^lib(acl|attr|audit|blkid|bz2-|cap-ng|cap|com-err|db[\\d.]+|ffi|gdbm(-compat)?|gmp|hogweed|k5crypto|keyutils|krb5|krb5support|lastlog2-|lz4-|lzma|md|mount|ncursesw|nettle|pcre2-8-|readline|seccomp|selinux|semanage|sepol|smartcols|sqlite3-|systemd|tinfo|udev|uuid|xxhash|zstd)\\d+(\\.\\d+)?(t64)?$",
  "^libaudit-common$", "^libsemanage-common$", "^libgssapi-krb5-\\d+$", "^libkrb5-\\d+$",
  "^libpam(0g|-modules(-bin)?|-runtime)$", "^zlib1g$",
  "^libssl(\\d+(t64)?|-dev)$", "^openssl(-provider-legacy)?$",
  "^libldap(2|-[\\d.]+-\\d+)$", "^libsasl2-(\\d+|modules-db)$", "^libpq(5|-dev)$",
  # --- Debian (stt image: python:3.11-slim + ffmpeg) ---
  # The `ffmpeg` CLI and the GPL/LGPL libraries of its dependency closure
  # (codecs, libav*, Mesa/X11 pulled in by libavdevice). The stt sidecar runs
  # ffmpeg as a separate program (subprocess) to decode uploads; no Lorekeeper
  # process links or loads these libraries (PyAV is deliberately not
  # installed), so shipping them is mere aggregation, the same as the shells
  # and tools above. Exact names: a new closure member needs review.
  "^ffmpeg$", "^fonts-dejavu-core$", "^fonts-dejavu-mono$", "^libasound2-data$",
  "^libasound2t64$", "^libass9$", "^libasyncns0$", "^libavc1394-0$", "^libavcodec61$",
  "^libavdevice61$", "^libavfilter10$", "^libavformat61$", "^libavutil59$", "^libbluray2$",
  "^libbs2b0$", "^libcaca0$", "^libcairo-gobject2$", "^libcairo2$", "^libcdio-cdda2t64$",
  "^libcdio-paranoia2t64$", "^libcdio19t64$", "^libchromaprint1$", "^libcodec2-1\\.2$",
  "^libdatrie1$", "^libdbus-1-3$", "^libdc1394-25$", "^libdecor-0-0$", "^libdvdnav4$",
  "^libdvdread8t64$", "^libelf1t64$", "^libfftw3-double3$", "^libflac14$", "^libflite1$",
  "^libfreetype6$", "^libfribidi0$", "^libgbm1$", "^libgdk-pixbuf-2\\.0-0$",
  "^libgdk-pixbuf2\\.0-common$", "^libgfortran5$", "^libgl1$", "^libgl1-mesa-dri$",
  "^libglib2\\.0-0t64$", "^libglvnd0$", "^libglx-mesa0$", "^libglx0$", "^libgme0$",
  "^libgnutls30t64$", "^libgraphite2-3$", "^libharfbuzz0b$", "^libidn2-0$", "^libiec61883-0$",
  "^libjack-jackd2-0$", "^libjbig0$", "^liblcms2-2$", "^libmbedcrypto16$", "^libmpg123-0t64$",
  "^libnuma1$", "^libopenal-data$", "^libopenal1$", "^libopenmpt0t64$", "^libp11-kit0$",
  "^libpciaccess0$", "^libpgm-5\\.3-0t64$", "^libplacebo349$", "^libpng16-16t64$",
  "^libpocketsphinx3$", "^libpostproc58$", "^libpulse0$", "^libraw1394-11$", "^librsvg2-2$",
  "^librubberband2$", "^libsamplerate0$", "^libsensors-config$", "^libsensors5$", "^libshine3$",
  "^libslang2$", "^libsndfile1$", "^libsodium23$", "^libsoxr0$", "^libspeex1$",
  "^libsphinxbase3t64$", "^libsrt1\\.5-gnutls$", "^libssh-4$", "^libsvtav1enc2$",
  "^libswresample5$", "^libswscale8$", "^libtasn1-6$", "^libthai-data$", "^libthai0$",
  "^libtheoradec1$", "^libtheoraenc1$", "^libtwolame0$", "^libudfread0$", "^libunistring5$",
  "^libusb-1\\.0-0$", "^libva-drm2$", "^libva-x11-2$", "^libva2$", "^libvidstab1\\.1$",
  "^libx264-164$", "^libx265-215$", "^libxvidcore4$", "^libz3-4$", "^libzimg2$", "^libzmq5$",
  "^libzvbi-common$", "^libzvbi0t64$", "^mesa-libgallium$", "^shared-mime-info$",
  "^x11-common$",
]

[artifacts]
# --check-artifacts: tracked files with these extensions under these roots
# are baked artifacts and each needs a model/voice/font register entry.
extensions = [
  ".woff2", ".woff", ".ttf", ".otf",
  ".gguf", ".onnx", ".safetensors", ".pt", ".pth", ".ckpt", ".bin", ".h5", ".tflite",
]
roots = ["site", "src", "nginx", "models", "assets"]

# Known gaps with an owning story (E0-QA.8). An UNREGISTERED scanned package
# that matches a [[pending]] entry prints a warning instead of failing; any
# other unregistered package still fails. Fields: ecosystem (register kind),
# package (name or glob, e.g. "nvidia-*"), tracking (owning story), reason,
# optional images (only scans with that --artifact use the entry).
#
# CUDA torch's NVIDIA wheels: E0-Platform.2 moved the shipped backend images
# to CPU torch, so the backend scan carries none of these and must keep
# failing if one comes back (no `backend` here, and the Dockerfile guard
# fails the build too). They remain a known gap only for the GPU override
# image AD-1 plans for `ml` (`ml-gpu`), whose redistribution under the NVIDIA
# EULA is an open owner decision (docs/LICENSING.md).

[[pending]]
ecosystem = "python"
package = "nvidia-*"
tracking = "E0-Platform AD-1 / ml CPU image"
reason = "NVIDIA CUDA runtime wheels (cuBLAS, cuDNN, NCCL, cuSPARSELt, ...) pulled in by CUDA torch; NVIDIA EULA, proprietary. Only the planned GPU override image may carry them, pending the owner's redistribution decision."
images = ["ml-gpu"]

[[pending]]
ecosystem = "python"
package = "cuda-toolkit"
tracking = "E0-Platform AD-1 / ml CPU image"
reason = "CUDA toolkit meta-wheel pulled in by CUDA torch; NVIDIA EULA. GPU override image only."
images = ["ml-gpu"]

[[pending]]
ecosystem = "python"
package = "cuda-bindings"
tracking = "E0-Platform AD-1 / ml CPU image"
reason = "CUDA Python bindings pulled in by CUDA torch; NVIDIA software licence. GPU override image only."
images = ["ml-gpu"]

[[pending]]
ecosystem = "python"
package = "cuda-pathfinder"
tracking = "E0-Platform AD-1 / ml CPU image"
reason = "CUDA library locator pulled in by CUDA torch alongside cuda-bindings. GPU override image only."
images = ["ml-gpu"]

[ignore]
# Tools that may be present only to run this check (never shipped).
python = ["pip-licenses", "prettytable", "wcwidth"]

# Owner-approved exceptions. `license` pins the string reviewed: if a new
# release changes it, the check fails again so it gets re-reviewed.
# Fields: ecosystem ("python" | "npm"), package, license, reason.

# --- LGPL, used unmodified via normal Python import (dynamic linking) -------
# LGPL-3.0 lets a proprietary/commercial work *use* the library provided it is
# not modified (or changes are published), its licence text and notice ship
# with the product, and users can swap in their own build of the library
# (true for a pip-installed package inside our Docker image). Do NOT vendor,
# patch or statically bundle it. OWNER TO CONFIRM before relying on it in the
# commercial edition. (The other LGPL entry here, the old LGPL-3.0 PDF
# library, was replaced by WeasyPrint on 2026-11-01, E0-QA.9.)

[[exception]]
ecosystem = "npm"
package = "caniuse-lite"
license = "CC-BY-4.0"
reason = "Browser-support data used by browserslist/autoprefixer at build time only; CC-BY permits commercial use (attribution only). OWNER TO CONFIRM."

# --- Register entries (licenses/register.yaml), ecosystem = entry kind -------

# (No image exceptions: the RSALv2/SSPL redis image was replaced by Valkey,
# BSD-3-Clause, on 2026-11-01.)
