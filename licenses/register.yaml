# Lorekeeper licence register: the inventory of everything we ship.
#
# Checked by scripts/check-licenses.py --register (.github/workflows/license-check.yml)
# against the rules in .github/license-policy.toml, in both editions
# (LOREKEEPER_EDITION = agpl | commercial; commercial is strict).
# Any PR that adds or changes a dependency, image, apt library, model, voice or
# font updates this file in the same PR.
#
# Entry fields:
#   name, kind (python | npm | image | apt | apk | model | voice | font), version
#   (informational; several versions comma-separated), license (SPDX),
#   source_url, editions (subset of [agpl, commercial]), notes.
#   model / voice / font: also `artifact` (repo path) or `download` (URL), plus `sha256`.
#   Optional: images (shipped images that carry it), scanned_license (the raw
#   metadata string, when it is not SPDX or is wrong), pip_package (a model
#   shipped as a pip package).
#
# GPL-family entries are allowed only with editions: [agpl] and images: [tts],
# except OS packages (apt / apk) on the policy's os_aggregate_allowlist (the
# unmodified OS of an image, mere aggregation; docs/LICENSING.md). The apt and
# apk rows come from the image-licenses scan (E0-QA.8): Debian licences are
# the union of the DEP-5 `License:` names in /usr/share/doc/<pkg>/copyright.
# When a scan string is not SPDX, `scanned_license` pins it and `license` is
# the reviewed licence the edition rules judge.
# The shipped backend images install CPU-only torch/torchvision from the
# PyTorch CPU index (E0-Platform.2), so they carry no NVIDIA wheels. The NVIDIA
# CUDA wheels pulled in by CUDA torch stay deliberately NOT registered, so any
# regression to a CUDA image fails the scan (E0-QA.8 scans the real images).
#
# Stubs for unregistered packages:
#   python scripts/check-licenses.py --python-env --register licenses/register.yaml --emit-missing
#
# Python and npm rows are one line each (flow style) to keep the diff per
# package to one line.

entries:
  # ---- base images (the five shipped image families, plus the build stage) ----
  - name: python
    kind: image
    version: "3.11-slim"
    license: PSF-2.0
    source_url: https://hub.docker.com/_/python
    editions: [agpl, commercial]
    images: [backend]
    notes: >-
      Base of src/backend/Dockerfile(.prod). Covers CPython only; the Debian
      packages inside the image (and apt installs: build-essential, libpq-dev)
      are scanned by E0-QA.8 (dpkg-query + copyright files).
  - name: pgvector/pgvector
    kind: image
    version: "pg16"
    license: PostgreSQL
    source_url: https://hub.docker.com/r/pgvector/pgvector
    editions: [agpl, commercial]
    images: [postgres]
    notes: PostgreSQL 16 plus the pgvector extension, both under the PostgreSQL licence. Used unmodified.
  - name: redis
    kind: image
    version: "7-alpine"
    license: LicenseRef-RSALv2 OR SSPL-1.0
    source_url: https://hub.docker.com/_/redis
    editions: [agpl, commercial]
    images: [redis]
    notes: >-
      docker-compose uses redis:7-alpine, which resolves to Redis 7.4.x
      (verified 7.4.12): dual RSALv2 / SSPLv1, not OSI-approved. Redis 7.2.x
      was the last BSD-3-Clause release. Covered by an [[exception]] marked
      OWNER TO CONFIRM; permissive options: pin redis:7.2-alpine or switch to
      valkey/valkey (BSD-3-Clause).
  - name: nginx
    kind: image
    version: "1.27-alpine"
    license: BSD-2-Clause
    source_url: https://hub.docker.com/_/nginx
    editions: [agpl, commercial]
    images: [nginx]
    notes: Base of nginx/Dockerfile (serves the built frontend). Alpine packages (openssl etc.) are scanned by E0-QA.8.
  - name: ollama/ollama
    kind: image
    version: "latest"
    license: MIT
    source_url: https://hub.docker.com/r/ollama/ollama
    editions: [agpl, commercial]
    images: [ollama]
    notes: Ollama (MIT) with llama.cpp (MIT). Used unmodified; models are installed at runtime (see model entries).
  - name: node
    kind: image
    version: "20-alpine"
    license: MIT
    source_url: https://hub.docker.com/_/node
    editions: [agpl, commercial]
    notes: Build stage only (nginx/Dockerfile builder, src/frontend/Dockerfile dev image); not present in a shipped image.

  # ---- apt / bundled system libraries ----
  - name: espeak-ng
    kind: apt
    version: "1.52"
    license: GPL-3.0-or-later
    source_url: https://github.com/espeak-ng/espeak-ng
    editions: [agpl]
    images: [tts]
    notes: >-
      LIC-1. G2P fallback for Kokoro TTS, bundled by espeakng-loader and pulled
      in by kokoro / kokoro-onnx / misaki. Excluded from the commercial build:
      it exists only in the optional AGPL-only `tts` container, and no backend
      image may install kokoro, kokoro-onnx, misaki, phonemizer or
      espeakng-loader. Without it fantasy proper nouns are silently dropped.
      Deferred spike: a non-GPL pronunciation path (Entity-name lexicon as
      Kokoro phoneme overrides). Legal review is an owner action.

