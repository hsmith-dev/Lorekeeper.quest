
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${BIND_IP:-127.0.0.1}:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Valkey (BSD-3-Clause, Linux Foundation): a drop-in, Redis-compatible
  # server. Replaces redis:7-alpine, which resolves to Redis 7.4+ (RSALv2 /
  # SSPL, not shippable in the commercial edition). The app reaches it at
  # VALKEY_URL (redis:// scheme, redis-py client: that's the wire protocol).
  # Fresh `valkey_data` volume: a Redis 7.4 dump (RDB format 12) can't be read
  # by Valkey 8, and everything stored here is short-lived. See "Upgrading
  # from Redis to Valkey" in README.md.
  valkey:
    image: valkey/valkey:8.1.11-alpine
    ports:
      - "${BIND_IP:-127.0.0.1}:6379:6379"
    volumes:
      - valkey_data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    # Transitional: the old `redis` hostname still resolves, so an existing
    # .env with REDIS_URL=redis://redis:6379/0 keeps working. Remove once
    # REDIS_URL is gone.
    networks:
      default:
        aliases: [redis]

  backend:
    build:
      context: ./src/backend
      dockerfile: Dockerfile
    ports:
      - "${BIND_IP:-127.0.0.1}:8000:8000"
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
    volumes:
      - ./src/backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    # What the `worker` service waits for (service_healthy).
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health', timeout=4)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
    # `default` for postgres/valkey/frontend, `models` to reach the ml sidecar.
    networks:
      - default
      - models

  # Background Jobs (E0-Jobs.3): an RQ WorkerPool of WORKER_PROCESSES
  # (default 2) LorekeeperWorker processes on the interactive, onsave and
  # backfill queues. Same image and env as the backend; starts once the
  # backend is healthy. No restart on code changes: restart it by hand.
  worker:
    build:
      context: ./src/backend
      dockerfile: Dockerfile
    env_file: .env
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - ./src/backend:/app
    command: python -m app.jobs.worker
    networks:
      - default
      - models
    deploy:
      resources:
        limits:
          memory: ${WORKER_MEM_LIMIT:-1g}

  # Shared embeddings + NER sidecar (src/services/ml). No ports: reachable
  # only from the backend over the internal `models` network, at ML_URL
  # (default http://ml:8000). Nothing calls it yet (E0-Platform.6).
  ml:
    # Tagged so scripts/sidecar_smoke.sh ml finds it by its default name.
    image: lorekeeper-ml:latest
    build:
      context: ./src/services/ml
      dockerfile: Dockerfile
    networks:
      - models
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=4)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 180s

  frontend:
    build:
      context: ./src/frontend
      dockerfile: Dockerfile
    ports:
      - "${BIND_IP:-127.0.0.1}:5173:5173"
    depends_on:
      - backend
    volumes:
      - ./src/frontend:/app
      - /app/node_modules
    command: npm run dev -- --host

networks:
  # internal: no route out of the network and no host port publishing, so
  # the ml sidecar can talk to the backend and nothing else.
  models:
    internal: true

volumes:
  postgres_data:
  valkey_data:
