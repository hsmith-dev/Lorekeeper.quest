
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${BIND_IP:-127.0.0.1}:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "${BIND_IP:-127.0.0.1}:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ./src/backend
      dockerfile: Dockerfile
    ports:
      - "${BIND_IP:-127.0.0.1}:8000:8000"
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./src/backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    # `default` for postgres/redis/frontend, `models` to reach the ml sidecar.
    networks:
      - default
      - models

  # Shared embeddings + NER sidecar (src/services/ml). No ports: reachable
  # only from the backend over the internal `models` network, at ML_URL
  # (default http://ml:8000). Nothing calls it yet (E0-Platform.6).
  ml:
    # Tagged so scripts/sidecar_smoke.sh ml finds it by its default name.
    image: lorekeeper-ml:latest
    build:
      context: ./src/services/ml
      dockerfile: Dockerfile
    networks:
      - models
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=4)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 180s

  frontend:
    build:
      context: ./src/frontend
      dockerfile: Dockerfile
    ports:
      - "${BIND_IP:-127.0.0.1}:5173:5173"
    depends_on:
      - backend
    volumes:
      - ./src/frontend:/app
      - /app/node_modules
    command: npm run dev -- --host

networks:
  # internal: no route out of the network and no host port publishing, so
  # the ml sidecar can talk to the backend and nothing else.
  models:
    internal: true

volumes:
  postgres_data:
  redis_data:
