# EV-4 exemptions: routes that need no spoiler-leak probe, each with a reason
# (tests/ev4/test_coverage.py fails on an empty reason, on a route that does
# not exist, and on a route that is also probed).
#
# Format:
#   - route: "GET /api/health"
#     reason: "Static liveness payload; reads no Campaign data."
- route: "GET /api/chat/health"
  reason: "Reports only whether the local LLM backend answers ({ai_online: bool}); reads no Campaign, session or user data."
- route: "GET /api/admin/jobs/stats"
  reason: "Admin-only (router-level require_admin): Job counts by status and queue across every Campaign; no kind, payload, Campaign id or other Campaign data."
# E0-QA.13: the account routes that read no Campaign data. GET /api/auth/me
# and PUT /api/auth/me/avatar are probed (probes/auth.py), and so is
# GET /api/billing/status (probes/billing.py).
- route: "POST /api/auth/register"
  reason: "Anonymous account creation: reads no Campaign, session or other user's data; answers with the new account's own token. Email enumeration and rate limits are covered by tests/test_auth.py, not a spoiler-leak concern."
- route: "POST /api/auth/login"
  reason: "Anonymous credential check: reads only the account being signed in to and returns its own token; no Campaign data. Lockout and constant-time behaviour are covered by tests/test_auth.py."
- route: "POST /api/auth/forgot-password"
  reason: "Anonymous; always returns the same fixed message whether or not the email exists; reads no Campaign data."
- route: "POST /api/auth/reset-password"
  reason: "Anonymous; consumes a reset token and changes only that token's account password; answers with a fixed message; no Campaign data."
- route: "POST /api/auth/tutorial-complete"
  reason: "Sets the caller's own has_completed_tutorial flag and returns the caller's own MeResponse (the same shape GET /api/auth/me returns, which probes/auth.py probes for cross-user leakage); no Campaign data."
- route: "POST /api/billing/checkout"
  reason: "Starts a Stripe checkout for the caller's own account (or 503 when Stripe is not configured); reads no Campaign data and no other user's billing."
- route: "POST /api/billing/portal"
  reason: "Opens the Stripe customer portal for the caller's own Stripe customer; reads no Campaign data and no other user's billing."
- route: "POST /api/billing/redeem-promo"
  reason: "Redeems a promo code onto the caller's own account and returns the caller's own billing status (probed in probes/billing.py); no Campaign data."
- route: "POST /api/billing/webhook"
  reason: "Stripe server-to-server webhook, authenticated by the Stripe signature, not a user; returns {received: true} only; no Campaign data."
- route: "GET /api/health"
  reason: "Unauthenticated liveness check: reports only whether the database and the local LLM backend answer (status/db/kobold booleans); reads no Campaign, session or user data."
